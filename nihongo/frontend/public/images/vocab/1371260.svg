<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A glass of water">
  <!-- 水 water. A filled glass rather than an abstract droplet: a concrete
       object reads instantly at thumbnail size, an abstraction does not. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <line x1="20" y1="100" x2="100" y2="100" stroke="#CFD6D9"/>
    <!-- glass -->
    <path d="M42 30 L46 100 L74 100 L78 30 Z" fill="#FBFAF7"/>
    <!-- water: one flat fill, no gradient -->
    <path d="M44.6 54 L46 100 L74 100 L75.4 54 Z" fill="#A9C6DC"/>
    <!-- surface ellipse, flat -->
    <ellipse cx="60" cy="54" rx="15.4" ry="3.6" fill="#C7DAE8"/>
    <!-- rim -->
    <ellipse cx="60" cy="30" rx="18" ry="4.4" fill="#DCE6EC"/>
    <!-- two small bubbles -->
    <circle cx="53" cy="72" r="2.4" fill="#DCE6EC" stroke="#7FA5C0" stroke-width="1.4"/>
    <circle cx="66" cy="82" r="1.8" fill="#DCE6EC" stroke="#7FA5C0" stroke-width="1.4"/>
    <!-- a single dropped leaf as the warm accent -->
    <path d="M88 96 Q94 88 102 92 Q96 100 88 96 Z" fill="#B7C5AE" stroke="#8FA394" stroke-width="1.8"/>
  </g>
</svg>
