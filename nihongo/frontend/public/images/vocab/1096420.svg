    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <path d="M24 34 Q42 26 60 34 Q78 42 96 34 Q100 56 96 82 Q78 90 60 82 Q42 74 24 82 Q20 56 24 34 Z" fill="#F2EBDD"/>
    <path d="M32 42 Q46 36 60 42 Q74 48 88 42" stroke="#CFD6D9" stroke-width="1.8"/>
    <path d="M28 62 Q44 55 60 62 Q76 69 92 62" stroke="#CFD6D9" stroke-width="1.8"/>
    <path d="M60 34 Q58 58 60 82" stroke="#B3BEC4" stroke-width="1.8"/>
    <path d="M76 46 Q80 50 84 46 Q80 54 76 46 Z" fill="#D8A7A0" stroke="none"/>
    <circle cx="40" cy="72" r="3.2" fill="#A9C6DC" stroke="none"/>
  </g>
</svg>
