<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="An open book">
  <!-- 本 book. Open, and the pages are deliberately BLANK — ruled lines would
       be the closest thing to text the direction allows, and even those are
       kept as faint neutral rules rather than anything readable. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <!-- pages -->
    <path d="M60 42 Q42 32 20 36 L20 84 Q42 80 60 90 Z" fill="#FBFAF7"/>
    <path d="M60 42 Q78 32 100 36 L100 84 Q78 80 60 90 Z" fill="#F2EBDD"/>
    <!-- spine -->
    <line x1="60" y1="42" x2="60" y2="90"/>
    <!-- covers peeking under the pages -->
    <path d="M20 84 Q42 80 60 90 Q78 80 100 84 L100 90 Q78 86 60 96 Q42 86 20 90 Z" fill="#A9C6DC"/>
    <!-- faint rules, no glyphs -->
    <g stroke="#CFD6D9" stroke-width="1.5">
      <line x1="28" y1="50" x2="52" y2="53"/>
      <line x1="28" y1="58" x2="52" y2="61"/>
      <line x1="28" y1="66" x2="52" y2="69"/>
      <line x1="68" y1="53" x2="92" y2="50"/>
      <line x1="68" y1="61" x2="92" y2="58"/>
      <line x1="68" y1="69" x2="92" y2="66"/>
    </g>
    <!-- ribbon bookmark: a filled strip with a notched foot. Drawn as an open
         stroke it read as a downward arrow. -->
    <path d="M56 44 L64 44 L64 68 L60 63 L56 68 Z" fill="#D8A7A0" stroke="#2F4858" stroke-width="1.8"/>
  </g>
</svg>
