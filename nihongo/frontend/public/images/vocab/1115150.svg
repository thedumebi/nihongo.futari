<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A swimming pool">
  <!-- プール pool. Water needs to look like water: wavy lane lines, not the
       straight ruled ones of the first attempt, which read as a blind. A
       ladder and a diving block put it outdoors and at scale. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="12" y="34" width="96" height="60" rx="5" fill="#DCE6EC"/>
    <rect x="20" y="42" width="80" height="44" rx="3" fill="#7FA5C0"/>
    <g stroke="#FBFAF7" stroke-width="2.4">
      <path d="M20 52 Q30 47 40 52 Q50 57 60 52 Q70 47 80 52 Q90 57 100 52"/>
      <path d="M20 64 Q30 59 40 64 Q50 69 60 64 Q70 59 80 64 Q90 69 100 64"/>
      <path d="M20 76 Q30 71 40 76 Q50 81 60 76 Q70 71 80 76 Q90 81 100 76"/>
    </g>
    <rect x="26" y="24" width="18" height="10" rx="2" fill="#F2EBDD"/>
    <g stroke="#B3BEC4" stroke-width="2.4">
      <line x1="88" y1="24" x2="88" y2="42"/>
      <line x1="98" y1="24" x2="98" y2="42"/>
      <line x1="88" y1="28" x2="98" y2="28"/>
      <line x1="88" y1="35" x2="98" y2="35"/>
    </g>
  </g>
</svg>
