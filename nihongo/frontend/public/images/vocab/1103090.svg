<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A loaf of bread">
  <!-- パン bread. Japanese shokupan: a tall square loaf with one slice
       leaning against it — the shape a Japanese bakery actually sells. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <line x1="16" y1="100" x2="104" y2="100" stroke="#CFD6D9"/>
    <path d="M30 90 L30 52 Q30 40 46 40 L70 40 Q86 40 86 52 L86 90 Z" fill="#E3D8C6"/>
    <path d="M30 56 Q58 48 86 56" stroke="#B3BEC4" stroke-width="2"/>
    <path d="M86 90 L86 62 Q86 56 94 56 Q102 56 102 64 L102 90 Z" fill="#F2EBDD"/>
    <line x1="30" y1="90" x2="102" y2="90"/>
  </g>
</svg>
