<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Coins and a note">
  <!-- お金 money. A folded note and two coins — one with the centre hole a
       5-yen and 50-yen piece actually have. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <line x1="16" y1="100" x2="104" y2="100" stroke="#CFD6D9"/>
    <rect x="20" y="44" width="56" height="30" rx="3" fill="#B7C5AE"/>
    <rect x="27" y="51" width="42" height="16" rx="2" fill="#FBFAF7" stroke="#8FA394" stroke-width="1.8"/>
    <circle cx="82" cy="76" r="16" fill="#E3D8C6"/>
    <circle cx="82" cy="76" r="5" fill="#FBFAF7"/>
    <circle cx="58" cy="86" r="13" fill="#DCE6EC"/>
    <circle cx="58" cy="86" r="8" fill="none" stroke="#B3BEC4" stroke-width="1.8"/>
  </g>
</svg>
