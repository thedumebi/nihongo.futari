<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A door">
  <!-- ドア door. A single panelled door in its frame, ajar just enough to
       read as a door rather than a rectangle. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="26" y="16" width="68" height="88" rx="3" fill="#F2EBDD"/>
    <rect x="34" y="24" width="52" height="72" rx="2" fill="#E3D8C6"/>
    <rect x="42" y="34" width="36" height="24" rx="2" fill="#FBFAF7" stroke="#B3BEC4" stroke-width="2"/>
    <rect x="42" y="66" width="36" height="20" rx="2" fill="#FBFAF7" stroke="#B3BEC4" stroke-width="2"/>
    <circle cx="79" cy="62" r="3.4" fill="#D8A7A0"/>
  </g>
</svg>
