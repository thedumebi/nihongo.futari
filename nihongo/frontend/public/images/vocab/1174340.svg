<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Swimming">
  <!-- 泳ぐ to swim. Read at a glance it must be a PERSON in water, so the body
       is a filled form along the surface with a visible head, one arm reaching
       and legs kicking. The first attempt was thin strokes and read as scribble. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <path d="M8 40 Q24 32 40 40 Q56 48 72 40 Q88 32 112 40" stroke="#A9C6DC" stroke-width="3"/>
    <path d="M30 62 Q50 54 70 62 Q84 68 96 64" stroke-width="9" stroke="#DCE6EC" stroke-linecap="round"/>
    <circle cx="30" cy="58" r="11" fill="#F2EBDD"/>
    <path d="M40 56 Q54 34 70 32" stroke-width="6" stroke="#DCE6EC"/>
    <path d="M70 32 L80 28" stroke-width="5" stroke="#2F4858"/>
    <path d="M96 64 L108 56 M96 64 L108 74" stroke-width="5" stroke="#DCE6EC"/>
    <path d="M8 84 Q28 76 48 84 Q68 92 88 84 Q104 78 112 82" stroke="#7FA5C0" stroke-width="3"/>
    <g fill="#A9C6DC" stroke="none">
      <circle cx="72" cy="24" r="3"/>
      <circle cx="84" cy="18" r="2.4"/>
      <circle cx="100" cy="48" r="2.6"/>
    </g>
  </g>
</svg>
