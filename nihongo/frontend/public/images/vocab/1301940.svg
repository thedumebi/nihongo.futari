<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="An umbrella">
  <!-- 傘 umbrella. Segmented canopy with a scalloped edge and a hooked handle:
       the everyday clear-plastic konbini umbrella shape, read as flat colour. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <!-- canopy -->
    <path d="M14 62 Q14 26 60 26 Q106 26 106 62 Q94 54 82 62 Q70 54 60 62 Q50 54 38 62 Q26 54 14 62 Z" fill="#A9C6DC"/>
    <!-- ribs, uniform weight -->
    <g stroke="#7FA5C0" stroke-width="1.6">
      <path d="M60 26 Q50 44 38 62"/>
      <path d="M60 26 Q70 44 82 62"/>
      <path d="M60 26 L60 62"/>
    </g>
    <!-- ferrule -->
    <line x1="60" y1="26" x2="60" y2="18"/>
    <!-- shaft and hook handle -->
    <path d="M60 62 L60 94 Q60 104 50 104 Q42 104 42 96" stroke-width="2.5"/>
    <!-- two rain marks, kept minimal -->
    <g stroke="#C7DAE8" stroke-width="2.2">
      <line x1="24" y1="76" x2="21" y2="86"/>
      <line x1="96" y1="76" x2="93" y2="86"/>
    </g>
    <!-- tip cap: the single accent -->
    <circle cx="60" cy="16" r="3" fill="#D8A7A0" stroke="none"/>
  </g>
</svg>
