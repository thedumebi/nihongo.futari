<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A school building">
  <!-- 学校 school. A Japanese school: long flat-roofed concrete block, regular
       window grid, central entrance, clock, and a sakura by the gate. Not a
       Western red-brick schoolhouse with a bell tower. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <line x1="8" y1="100" x2="112" y2="100" stroke="#CFD6D9"/>
    <!-- main block -->
    <rect x="18" y="44" width="84" height="56" fill="#F2EBDD"/>
    <!-- flat roof parapet -->
    <rect x="15" y="40" width="90" height="6" fill="#DCE6EC"/>
    <!-- regular window grid, the defining feature -->
    <g fill="#A9C6DC" stroke="#2F4858" stroke-width="1.6">
      <rect x="26" y="53" width="13" height="10"/><rect x="45" y="53" width="13" height="10"/>
      <rect x="62" y="53" width="13" height="10"/><rect x="81" y="53" width="13" height="10"/>
      <rect x="26" y="70" width="13" height="10"/><rect x="45" y="70" width="13" height="10"/>
      <rect x="62" y="70" width="13" height="10"/><rect x="81" y="70" width="13" height="10"/>
    </g>
    <!-- entrance -->
    <rect x="52" y="84" width="16" height="16" fill="#DCE6EC"/>
    <line x1="60" y1="84" x2="60" y2="100" stroke-width="1.8"/>
    <!-- canopy -->
    <path d="M48 84 L72 84 L69 79 L51 79 Z" fill="#B3BEC4"/>
    <!-- clock: a small circle, hands only, no numerals (no text rule) -->
    <circle cx="60" cy="35" r="7" fill="#FBFAF7"/>
    <path d="M60 35 L60 31 M60 35 L63 37" stroke-width="1.8"/>
    <!-- sakura by the gate: sage trunk, dusty-rose canopy as the accent -->
    <path d="M100 100 L100 88" stroke="#8FA394"/>
    <circle cx="96" cy="83" r="6" fill="#D8A7A0" stroke="none"/>
    <circle cx="104" cy="84" r="5" fill="#D8A7A0" stroke="none"/>
    <circle cx="100" cy="78" r="5.5" fill="#D8A7A0" stroke="none"/>
  </g>
</svg>
