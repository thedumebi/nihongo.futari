<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A guitar">
  <!-- ギター guitar. The body has to dominate: a waisted figure-of-eight wide
       enough to read as a soundbox, with a short neck. Drawn small, a slim
       body plus a long neck just reads as a spoon. -->
