<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A commuter train">
  <!-- 電車 train. A Japanese commuter EMU seen head-on-ish: flat front, a
       single livery stripe, pantograph. Not a Western locomotive. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <!-- track -->
    <line x1="10" y1="100" x2="110" y2="100" stroke="#CFD6D9"/>
    <g stroke="#B3BEC4" stroke-width="1.6">
      <line x1="22" y1="100" x2="22" y2="104"/>
      <line x1="46" y1="100" x2="46" y2="104"/>
      <line x1="74" y1="100" x2="74" y2="104"/>
      <line x1="98" y1="100" x2="98" y2="104"/>
    </g>
    <!-- pantograph -->
    <path d="M52 34 L60 26 L68 34" stroke-width="2"/>
    <line x1="46" y1="26" x2="74" y2="26" stroke="#B3BEC4" stroke-width="1.6"/>
    <!-- car body -->
    <rect x="26" y="36" width="68" height="56" rx="10" fill="#DCE6EC"/>
    <!-- livery stripe: the powder-blue band Japanese lines use -->
    <rect x="26" y="60" width="68" height="8" fill="#A9C6DC" stroke="none"/>
    <line x1="26" y1="60" x2="94" y2="60" stroke="#2F4858" stroke-width="1.8"/>
    <line x1="26" y1="68" x2="94" y2="68" stroke="#2F4858" stroke-width="1.8"/>
    <!-- cab window -->
    <rect x="38" y="44" width="44" height="12" rx="4" fill="#7FA5C0"/>
    <!-- door -->
    <rect x="50" y="72" width="20" height="20" rx="2" fill="#F2EBDD"/>
    <line x1="60" y1="72" x2="60" y2="92" stroke-width="1.8"/>
    <!-- headlights -->
    <circle cx="34" cy="86" r="3.4" fill="#F2EBDD"/>
    <circle cx="86" cy="86" r="3.4" fill="#F2EBDD"/>
    <!-- destination blind, blank on purpose: no text in the artwork -->
    <rect x="76" y="44" width="0" height="0" fill="none" stroke="none"/>
    <!-- bogies -->
    <rect x="34" y="92" width="18" height="6" rx="3" fill="#B3BEC4"/>
    <rect x="68" y="92" width="18" height="6" rx="3" fill="#B3BEC4"/>
  </g>
</svg>
