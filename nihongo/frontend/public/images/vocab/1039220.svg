<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A calendar">
  <!-- カレンダー calendar. A grid of days with no numerals: the ruling is
       what makes it a calendar, and digits would be text in the artwork. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="20" y="26" width="80" height="76" rx="5" fill="#FBFAF7"/>
    <path d="M20 42 L20 31 Q20 26 25 26 L95 26 Q100 26 100 31 L100 42 Z" fill="#D8A7A0"/>
    <line x1="38" y1="30" x2="38" y2="18" stroke-width="3"/>
    <line x1="82" y1="30" x2="82" y2="18" stroke-width="3"/>
    <g stroke="#CFD6D9" stroke-width="1.8">
      <line x1="20" y1="58" x2="100" y2="58"/>
      <line x1="20" y1="74" x2="100" y2="74"/>
      <line x1="20" y1="90" x2="100" y2="90"/>
      <line x1="46" y1="42" x2="46" y2="102"/>
      <line x1="72" y1="42" x2="72" y2="102"/>
    </g>
    <rect x="50" y="62" width="18" height="8" rx="2" fill="#A9C6DC" stroke="none"/>
  </g>
</svg>
