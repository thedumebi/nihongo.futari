<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A fish">
  <!-- 魚 fish. A whole fish on a plate reads as food, which is how the word is
       most often met; the plate also anchors it as a Japanese table object. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <!-- plate -->
    <ellipse cx="60" cy="80" rx="44" ry="14" fill="#F2EBDD"/>
    <ellipse cx="60" cy="78" rx="34" ry="9.5" fill="#DCE6EC" stroke="#B3BEC4" stroke-width="1.6"/>
    <!-- body -->
    <path d="M30 62 Q52 44 78 56 Q90 61 96 66 Q86 74 78 76 Q52 84 30 62 Z" fill="#A9C6DC"/>
    <!-- tail -->
    <path d="M30 62 Q22 54 18 50 Q22 64 18 74 Q26 70 30 62 Z" fill="#7FA5C0"/>
    <!-- dorsal fin -->
    <path d="M56 50 Q62 42 70 46 Q64 50 60 52 Z" fill="#7FA5C0"/>
    <!-- gill and eye -->
    <path d="M84 58 Q80 66 84 74" stroke-width="1.8"/>
    <circle cx="89" cy="65" r="2.4" fill="#2F4858" stroke="none"/>
    <!-- a citrus wedge and a shiso leaf. A circle with crossed lines read as a
         crosshair; a wedge reads as fruit. -->
    <path d="M26 86 Q26 76 36 76 Q34 84 26 86 Z" fill="#D8A7A0" stroke="#2F4858" stroke-width="1.8"/>
    <path d="M30 78 Q32 82 28 84" stroke="#FBFAF7" stroke-width="1.3" fill="none"/>
  </g>
</svg>
