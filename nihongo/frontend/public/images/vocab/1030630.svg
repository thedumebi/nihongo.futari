<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="An elevator">
  <!-- エレベーター elevator. Two doors meeting at a centre seam, a call panel
       beside them, and the up-down arrows that name it. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="24" y="16" width="62" height="88" rx="3" fill="#DCE6EC"/>
    <rect x="30" y="24" width="50" height="76" fill="#B3BEC4"/>
    <rect x="32" y="26" width="22" height="72" fill="#F2EBDD"/>
    <rect x="56" y="26" width="22" height="72" fill="#F2EBDD"/>
    <line x1="55" y1="26" x2="55" y2="98" stroke="#B3BEC4" stroke-width="2"/>
    <rect x="92" y="44" width="12" height="24" rx="3" fill="#FBFAF7"/>
    <path d="M98 50 L101 55 L95 55 Z" fill="#D8A7A0" stroke="none"/>
    <path d="M98 62 L101 57 L95 57 Z" fill="#7FA5C0" stroke="none"/>
  </g>
</svg>
