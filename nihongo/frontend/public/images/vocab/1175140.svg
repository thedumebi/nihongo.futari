    <path d="M38 92 L38 48 Q38 42 46 42 L96 42 Q104 42 104 50 L104 92 Z" fill="#DCE6EC"/>
    <rect x="46" y="50" width="20" height="16" rx="2" fill="#A9C6DC"/>
