<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A spoon">
  <!-- スプーン spoon. Third attempt. A round bowl on a short stem reads as a
       magnifying glass or a hand mirror no matter what is drawn inside it, so
       the proportions carry the meaning: a SMALL shallow bowl at the top of a
       handle that runs most of the frame, laid on a diagonal like cutlery on a
       table rather than standing up like a lens. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <g transform="rotate(24 60 60)">
      <ellipse cx="60" cy="30" rx="15" ry="20" fill="#DCE6EC"/>
      <ellipse cx="60" cy="30" rx="9" ry="13" fill="#B3BEC4" stroke="none"/>
      <path d="M56 50 Q54 62 55 74 L57 100 Q60 106 63 100 L65 74 Q66 62 64 50 Z" fill="#DCE6EC"/>
    </g>
  </g>
</svg>
