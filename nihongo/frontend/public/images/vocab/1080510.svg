<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A television">
  <!-- テレビ television. A flat panel on a stand; the screen is left blank
       because no text or imagery is allowed inside the artwork. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <line x1="16" y1="100" x2="104" y2="100" stroke="#CFD6D9"/>
    <rect x="20" y="30" width="80" height="50" rx="4" fill="#DCE6EC"/>
    <rect x="27" y="37" width="66" height="36" rx="2" fill="#A9C6DC" stroke="none"/>
    <line x1="60" y1="80" x2="60" y2="92"/>
    <line x1="44" y1="92" x2="76" y2="92"/>
  </g>
</svg>
