<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="A cat">
  <!-- 猫 cat. Sitting, built from circles and one curved tail — "simple
       geometric forms, soft shapes" rather than a rendered animal. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="120" fill="#FBFAF7" stroke="none"/>
    <line x1="16" y1="98" x2="104" y2="98" stroke="#CFD6D9"/>
    <!-- tail, curling round the base -->
    <path d="M78 96 Q98 96 96 82 Q95 74 88 76" stroke="#2F4858"/>
    <!-- body -->
    <path d="M44 98 Q40 70 60 68 Q80 70 76 98 Z" fill="#E3D8C6"/>
    <!-- head -->
    <circle cx="60" cy="54" r="19" fill="#F2EBDD"/>
    <!-- ears -->
    <path d="M46 42 L44 28 L58 36 Z" fill="#F2EBDD"/>
    <path d="M74 42 L76 28 L62 36 Z" fill="#F2EBDD"/>
    <path d="M48 39 L47 32 L54 37 Z" fill="#D8A7A0" stroke="none"/>
    <path d="M72 39 L73 32 L66 37 Z" fill="#D8A7A0" stroke="none"/>
    <!-- face: closed, calm eyes; the mood is "peaceful, refined" -->
    <path d="M50 52 Q54 56 58 52" stroke-width="2.2"/>
    <path d="M62 52 Q66 56 70 52" stroke-width="2.2"/>
    <path d="M58 60 Q60 62 62 60" stroke-width="2.2"/>
    <!-- whiskers, kept to two per side -->
    <g stroke="#B3BEC4" stroke-width="1.6">
      <line x1="42" y1="58" x2="30" y2="55"/>
      <line x1="42" y1="62" x2="31" y2="63"/>
      <line x1="78" y1="58" x2="90" y2="55"/>
      <line x1="78" y1="62" x2="89" y2="63"/>
    </g>
    <!-- collar: the single accent -->
    <path d="M48 71 Q60 78 72 71" stroke="#D8A7A0" stroke-width="2.6"/>
  </g>
</svg>
