<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A crossed-out calendar square">
  <!-- Cancelling on a friend: tonight is off. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="26" y="20" width="108" height="82" rx="4" fill="#F2EBDD"/>
    <rect x="26" y="20" width="108" height="18" fill="#A9C6DC"/>
    <g stroke="#B3BEC4" stroke-width="1.4">
      <line x1="26" y1="60" x2="134" y2="60"/><line x1="26" y1="80" x2="134" y2="80"/>
      <line x1="62" y1="38" x2="62" y2="102"/><line x1="98" y1="38" x2="98" y2="102"/>
    </g>
    <g stroke="#D8A7A0" stroke-width="4">
      <line x1="70" y1="66" x2="90" y2="76"/><line x1="90" y1="66" x2="70" y2="76"/>
    </g>
    <line x1="46" y1="20" x2="46" y2="12"/><line x1="114" y1="20" x2="114" y2="12"/>
  </g>
</svg>
