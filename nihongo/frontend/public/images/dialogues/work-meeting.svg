<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A meeting table seen from above">
  <!-- Joining a meeting late: the table with one empty chair. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <ellipse cx="80" cy="60" rx="52" ry="30" fill="#DCE6EC"/>
    <g fill="#A9C6DC" stroke="#2F4858">
      <circle cx="44" cy="30" r="8"/><circle cx="80" cy="24" r="8"/><circle cx="116" cy="30" r="8"/>
      <circle cx="44" cy="90" r="8"/><circle cx="116" cy="90" r="8"/>
    </g>
    <circle cx="80" cy="96" r="8" fill="#FBFAF7" stroke="#D8A7A0" stroke-width="3"/>
    <rect x="60" y="50" width="40" height="20" rx="2" fill="#F2EBDD"/>
  </g>
</svg>
