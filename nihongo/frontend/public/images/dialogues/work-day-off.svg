<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A calendar with one day circled">
  <!-- Asking for a day off: one square on the wall calendar, ringed. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="26" y="20" width="108" height="82" rx="4" fill="#F2EBDD"/>
    <rect x="26" y="20" width="108" height="18" fill="#A9C6DC"/>
    <g stroke="#B3BEC4" stroke-width="1.4">
      <line x1="26" y1="56" x2="134" y2="56"/><line x1="26" y1="74" x2="134" y2="74"/>
      <line x1="53" y1="38" x2="53" y2="102"/><line x1="80" y1="38" x2="80" y2="102"/>
      <line x1="107" y1="38" x2="107" y2="102"/>
    </g>
    <circle cx="93" cy="65" r="11" stroke="#D8A7A0" stroke-width="3.5"/>
    <line x1="46" y1="20" x2="46" y2="12"/><line x1="114" y1="20" x2="114" y2="12"/>
  </g>
</svg>
