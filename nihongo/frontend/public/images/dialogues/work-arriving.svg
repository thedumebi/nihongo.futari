<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="An office door and a clock at nine">
  <!-- Arriving at work: through the door, on the hour. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="24" y="20" width="62" height="84" fill="#DCE6EC"/>
    <line x1="86" y1="20" x2="86" y2="104"/>
    <rect x="36" y="34" width="38" height="24" fill="#C7DAE8"/>
    <circle cx="80" cy="66" r="3" fill="#2F4858"/>
    <circle cx="122" cy="46" r="24" fill="#F2EBDD"/>
    <line x1="122" y1="46" x2="122" y2="30"/>
    <line x1="122" y1="46" x2="134" y2="46" stroke="#D8A7A0" stroke-width="3"/>
    <line x1="16" y1="104" x2="144" y2="104"/>
  </g>
</svg>
