<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A bank book and a card">
  <!-- At the bank: opening an account. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="22" y="30" width="72" height="52" rx="3" fill="#C7DAE8"/>
    <rect x="30" y="38" width="56" height="36" fill="#FBFAF7"/>
    <g stroke="#B3BEC4" stroke-width="1.6">
      <line x1="38" y1="48" x2="78" y2="48"/><line x1="38" y1="58" x2="78" y2="58"/><line x1="38" y1="66" x2="64" y2="66"/>
    </g>
    <rect x="72" y="66" width="60" height="38" rx="5" fill="#A9C6DC"/>
    <rect x="72" y="76" width="60" height="8" fill="#2F4858" stroke="none"/>
    <rect x="80" y="90" width="20" height="8" rx="2" fill="#D8A7A0"/>
