<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A ticket machine">
  <!-- Buying a ticket: the machine, a ticket in the slot. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="34" y="16" width="92" height="88" rx="5" fill="#DCE6EC"/>
    <rect x="44" y="26" width="72" height="30" fill="#C7DAE8"/>
    <g fill="#F2EBDD" stroke="#2F4858" stroke-width="2">
      <rect x="46" y="64" width="18" height="12"/><rect x="70" y="64" width="18" height="12"/>
      <rect x="94" y="64" width="18" height="12"/>
    </g>
    <rect x="60" y="86" width="40" height="8" fill="#FBFAF7"/>
    <rect x="66" y="88" width="28" height="10" fill="#D8A7A0"/>
  </g>
</svg>
