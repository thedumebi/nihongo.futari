    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <path d="M26 24 L82 24 L82 100 L26 100 Z" fill="#F2EBDD"/>
    <g stroke="#B3BEC4" stroke-width="1.6">
      <line x1="36" y1="40" x2="72" y2="40"/><line x1="36" y1="52" x2="72" y2="52"/>
      <line x1="36" y1="64" x2="60" y2="64"/>
    </g>
    <circle cx="116" cy="66" r="26" fill="#DCE6EC"/>
    <line x1="116" y1="66" x2="116" y2="48"/>
    <line x1="116" y1="66" x2="130" y2="74" stroke="#D8A7A0" stroke-width="3"/>
    <circle cx="116" cy="66" r="3" fill="#2F4858" stroke="none"/>
  </g>
