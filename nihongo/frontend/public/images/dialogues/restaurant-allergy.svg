<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="An egg with a line through it">
  <!-- Mentioning an allergy: an egg, crossed out. The one drawing in the set
       that has to say "not this". -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <ellipse cx="80" cy="102" rx="52" ry="8" fill="#DCE6EC" stroke="none"/>
    <ellipse cx="66" cy="66" rx="24" ry="30" fill="#F2EBDD"/>
    <ellipse cx="66" cy="72" rx="11" ry="9" fill="#E3D8C6" stroke="none"/>
    <circle cx="104" cy="52" r="26" stroke="#D8A7A0" stroke-width="4"/>
    <line x1="86" y1="34" x2="122" y2="70" stroke="#D8A7A0" stroke-width="4"/>
  </g>
</svg>
