<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A clock beside a stopped train">
  <!-- A delayed train: a clock and a train that is not moving. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>
    <rect x="16" y="52" width="76" height="42" rx="6" fill="#C7DAE8"/>
    <rect x="26" y="62" width="24" height="16" fill="#DCE6EC"/>
    <rect x="58" y="62" width="24" height="16" fill="#DCE6EC"/>
    <circle cx="34" cy="98" r="5"/><circle cx="74" cy="98" r="5"/>
    <circle cx="122" cy="46" r="26" fill="#F2EBDD"/>
    <line x1="122" y1="46" x2="122" y2="30"/>
    <line x1="122" y1="46" x2="136" y2="52" stroke="#D8A7A0" stroke-width="3"/>
  </g>
</svg>
