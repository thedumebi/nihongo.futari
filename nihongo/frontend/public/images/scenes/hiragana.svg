<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A writing brush and practice paper">
  <!-- Hiragana. A brush resting on a sheet of squared practice paper, an
       inkstone beside it. The strokes are abstract curves, NOT characters —
       the direction forbids any lettering in the artwork. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- practice paper -->
    <rect x="18" y="20" width="88" height="80" fill="#F2EBDD"/>
    <g stroke="#B3BEC4" stroke-width="1.2">
      <line x1="18" y1="46" x2="106" y2="46"/>
      <line x1="18" y1="72" x2="106" y2="72"/>
      <line x1="47" y1="20" x2="47" y2="100"/>
      <line x1="76" y1="20" x2="76" y2="100"/>
    </g>
    <rect x="18" y="20" width="88" height="80"/>

    <!-- two soft practice curves, abstract on purpose -->
    <path d="M26 38 C34 28 42 40 34 44" stroke="#7FA5C0" stroke-width="2"/>
    <path d="M56 62 C64 54 70 66 60 70" stroke="#7FA5C0" stroke-width="2"/>

    <!-- brush lying across the sheet -->
    <line x1="96" y1="108" x2="140" y2="52"/>
    <path d="M140 52 L146 44 L152 48 L146 58 Z" fill="#E3D8C6"/>
    <path d="M92 112 L96 108 L100 112 L96 118 Z" fill="#2F4858"/>

    <!-- inkstone, the accent -->
    <ellipse cx="126" cy="98" rx="18" ry="9" fill="#C7DAE8"/>
    <ellipse cx="126" cy="96" rx="10" ry="5" fill="#D8A7A0" stroke="none"/>
  </g>
</svg>
