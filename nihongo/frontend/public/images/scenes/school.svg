<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A classroom with a board and desks">
  <!-- At school. A blackboard, a teacher's small figure to one side, two
       pupil desks. Deliberately no writing on the board. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- board -->
    <rect x="16" y="12" width="106" height="46" fill="#8FA394"/>
    <rect x="16" y="58" width="106" height="5" fill="#E3D8C6"/>

    <!-- teacher, small, to the side -->
    <circle cx="140" cy="40" r="7" fill="#F2EBDD"/>
    <path d="M130 66 C130 52 150 52 150 66 Z" fill="#A9C6DC"/>

    <!-- floor -->
    <line x1="0" y1="76" x2="160" y2="76" stroke="#B3BEC4" stroke-width="1.4"/>

    <!-- two desks -->
    <rect x="18" y="84" width="44" height="7" fill="#E3D8C6"/>
    <line x1="24" y1="91" x2="24" y2="108"/>
    <line x1="56" y1="91" x2="56" y2="108"/>
    <rect x="86" y="84" width="44" height="7" fill="#E3D8C6"/>
    <line x1="92" y1="91" x2="92" y2="108"/>
    <line x1="124" y1="91" x2="124" y2="108"/>

    <!-- an open notebook and a satchel accent -->
    <path d="M28 84 L40 80 L52 84" fill="#FBFAF7"/>
    <rect x="94" y="76" width="16" height="8" rx="2" fill="#D8A7A0"/>
  </g>
</svg>
