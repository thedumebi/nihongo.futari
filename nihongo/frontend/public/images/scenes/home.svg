<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A room in a Japanese home">
  <!-- Around the house. A washitsu: shoji screens, tatami edging, a low table
       with a cushion. No figures — the room itself is the subject. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- shoji screens across the back wall -->
    <rect x="14" y="16" width="132" height="56" fill="#F2EBDD"/>
    <g stroke="#B3BEC4" stroke-width="1.4">
      <line x1="47" y1="16" x2="47" y2="72"/>
      <line x1="80" y1="16" x2="80" y2="72"/>
      <line x1="113" y1="16" x2="113" y2="72"/>
      <line x1="14" y1="35" x2="146" y2="35"/>
      <line x1="14" y1="54" x2="146" y2="54"/>
    </g>
    <rect x="14" y="16" width="132" height="56"/>

    <!-- tatami floor line -->
    <line x1="6" y1="80" x2="154" y2="80" stroke="#8FA394"/>
    <rect x="6" y="80" width="148" height="34" fill="#B7C5AE" stroke="none" opacity="0.35"/>

    <!-- low table -->
    <rect x="52" y="86" width="56" height="8" fill="#E3D8C6"/>
    <line x1="60" y1="94" x2="60" y2="106"/>
    <line x1="100" y1="94" x2="100" y2="106"/>

    <!-- cushion, the one accent -->
    <ellipse cx="128" cy="100" rx="14" ry="7" fill="#D8A7A0"/>

    <!-- a small potted plant -->
    <path d="M26 100 L34 100 L32 112 L28 112 Z" fill="#E3D8C6"/>
    <path d="M30 100 C26 92 26 88 30 84" stroke="#8FA394"/>
    <path d="M30 100 C34 93 36 90 34 86" stroke="#8FA394"/>
  </g>
</svg>
