<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A railway station platform">
  <!-- At the station. Platform edge with its tactile paving strip, a train
       alongside, a departure board left blank (no text rule), one waiting
       figure. Recognisably a Japanese commuter platform. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- canopy -->
    <path d="M6 22 L154 22" stroke-width="2.5"/>
    <line x1="20" y1="22" x2="20" y2="92" stroke="#B3BEC4"/>
    <line x1="140" y1="22" x2="140" y2="92" stroke="#B3BEC4"/>

    <!-- hanging departure board, blank on purpose -->
    <line x1="66" y1="22" x2="66" y2="30" stroke="#B3BEC4" stroke-width="1.6"/>
    <line x1="98" y1="22" x2="98" y2="30" stroke="#B3BEC4" stroke-width="1.6"/>
    <rect x="60" y="30" width="44" height="16" rx="2" fill="#2F4858"/>
    <g stroke="#7FA5C0" stroke-width="1.6">
      <line x1="66" y1="36" x2="82" y2="36"/>
      <line x1="66" y1="41" x2="76" y2="41"/>
      <line x1="88" y1="36" x2="98" y2="36"/>
    </g>

    <!-- train alongside the platform -->
    <rect x="96" y="52" width="58" height="34" rx="6" fill="#DCE6EC"/>
    <rect x="96" y="64" width="58" height="6" fill="#A9C6DC" stroke="none"/>
    <line x1="96" y1="64" x2="154" y2="64" stroke-width="1.6"/>
    <line x1="96" y1="70" x2="154" y2="70" stroke-width="1.6"/>
    <rect x="104" y="56" width="14" height="7" rx="2" fill="#7FA5C0"/>
    <rect x="132" y="56" width="14" height="7" rx="2" fill="#7FA5C0"/>
    <rect x="118" y="72" width="14" height="14" rx="1.5" fill="#F2EBDD"/>
    <line x1="125" y1="72" x2="125" y2="86" stroke-width="1.6"/>

    <!-- platform, with the yellow tactile strip rendered in the palette's sage -->
    <rect x="6" y="86" width="88" height="6" fill="#E3D8C6"/>
    <rect x="6" y="92" width="148" height="16" fill="#CFD6D9"/>
    <rect x="78" y="86" width="16" height="6" fill="#B7C5AE" stroke="none"/>
    <g stroke="#8FA394" stroke-width="1.4">
      <line x1="81" y1="87" x2="81" y2="91"/><line x1="86" y1="87" x2="86" y2="91"/><line x1="91" y1="87" x2="91" y2="91"/>
    </g>

    <!-- one waiting passenger with a bag: the accent -->
    <circle cx="44" cy="70" r="7" fill="#E3D8C6"/>
    <path d="M35 86 Q35 76 44 76 Q53 76 53 86 Z" fill="#A9C6DC"/>
    <rect x="53" y="78" width="10" height="8" rx="1.5" fill="#D8A7A0"/>
  </g>
</svg>
