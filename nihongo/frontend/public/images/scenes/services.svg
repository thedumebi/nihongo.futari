<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A service counter with a parcel">
  <!-- Errands. A counter with a window, a parcel and a stamped slip on it,
       a clerk's small figure behind. Post office, bank, dry cleaner alike. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- back wall with a shuttered window -->
    <rect x="0" y="0" width="160" height="70" fill="#DCE6EC" stroke="none"/>
    <rect x="30" y="12" width="100" height="34" fill="#F2EBDD"/>
    <line x1="30" y1="24" x2="130" y2="24" stroke="#B3BEC4" stroke-width="1.4"/>
    <rect x="30" y="12" width="100" height="34"/>

    <!-- clerk behind the counter -->
    <circle cx="112" cy="56" r="7" fill="#F2EBDD"/>
    <path d="M102 74 C102 62 122 62 122 74 Z" fill="#A9C6DC"/>

    <!-- counter -->
    <line x1="0" y1="78" x2="160" y2="78"/>
    <rect x="0" y="78" width="160" height="10" fill="#E3D8C6" stroke="none"/>

    <!-- parcel with a tied string -->
    <rect x="26" y="56" width="34" height="22" fill="#B7C5AE"/>
    <line x1="43" y1="56" x2="43" y2="78" stroke="#8FA394" stroke-width="1.8"/>
    <line x1="26" y1="67" x2="60" y2="67" stroke="#8FA394" stroke-width="1.8"/>

    <!-- a small slip, the accent -->
    <rect x="68" y="70" width="20" height="8" fill="#D8A7A0"/>
    <line x1="0" y1="88" x2="160" y2="88"/>
  </g>
</svg>
