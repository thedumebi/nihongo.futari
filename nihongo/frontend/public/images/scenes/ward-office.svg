<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A ward office counter">
  <!-- At the ward office. A service counter with a numbered-ticket dispenser,
       a stack of forms, a clerk and an applicant. Forms and the number display
       are blank shapes — the direction forbids lettering. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- back wall with window bays -->
    <rect x="10" y="12" width="140" height="62" fill="#F2EBDD"/>
    <g fill="#DCE6EC" stroke="#2F4858" stroke-width="1.8">
      <rect x="20" y="20" width="30" height="20"/>
      <rect x="110" y="20" width="30" height="20"/>
    </g>

    <!-- now-serving display: blank panel with two blocks, no numerals -->
    <rect x="64" y="18" width="32" height="16" rx="2" fill="#2F4858"/>
    <rect x="70" y="23" width="7" height="6" fill="#B7C5AE" stroke="none"/>
    <rect x="83" y="23" width="7" height="6" fill="#B7C5AE" stroke="none"/>

    <!-- counter -->
    <rect x="10" y="74" width="140" height="10" fill="#E3D8C6"/>
    <rect x="10" y="84" width="140" height="24" fill="#DCE6EC"/>
    <line x1="10" y1="108" x2="150" y2="108" stroke="#CFD6D9"/>

    <!-- a partition between bays -->
    <line x1="80" y1="52" x2="80" y2="74" stroke="#B3BEC4" stroke-width="2"/>

    <!-- stack of forms and a pen on the counter -->
    <rect x="92" y="66" width="20" height="8" fill="#FBFAF7"/>
    <rect x="94" y="63" width="20" height="8" fill="#FBFAF7"/>
    <g stroke="#CFD6D9" stroke-width="1.3">
      <line x1="98" y1="66" x2="110" y2="66"/><line x1="98" y1="69" x2="107" y2="69"/>
    </g>
    <line x1="118" y1="72" x2="128" y2="66" stroke="#D8A7A0" stroke-width="2.4"/>

    <!-- ticket dispenser at the end of the counter -->
    <rect x="134" y="58" width="14" height="16" rx="2" fill="#B7C5AE"/>
    <rect x="137" y="72" width="8" height="4" fill="#FBFAF7" stroke="#2F4858" stroke-width="1.4"/>

    <!-- clerk behind, applicant in front; both small -->
    <circle cx="40" cy="60" r="7" fill="#E3D8C6"/>
    <path d="M31 74 Q31 65 40 65 Q49 65 49 74 Z" fill="#B7C5AE"/>
    <circle cx="62" cy="86" r="6.5" fill="#E3D8C6"/>
    <path d="M54 100 Q54 92 62 92 Q70 92 70 100 Z" fill="#A9C6DC"/>
  </g>
</svg>
