<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A Japanese bathroom with a deep tub">
  <!-- The bath. The ofuro: a deep square tub, a washing stool and bucket
       beside it, steam rising. Washing happens outside the tub. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- tiled wall -->
    <rect x="0" y="0" width="160" height="60" fill="#DCE6EC" stroke="none"/>
    <g stroke="#B3BEC4" stroke-width="1.2">
      <line x1="0" y1="30" x2="160" y2="30"/>
      <line x1="53" y1="0" x2="53" y2="60"/>
      <line x1="107" y1="0" x2="107" y2="60"/>
    </g>

    <!-- the tub -->
    <path d="M84 56 L84 104 L150 104 L150 56 Z" fill="#C7DAE8"/>
    <rect x="84" y="56" width="66" height="12" fill="#A9C6DC"/>
    <path d="M88 74 C98 70 106 78 116 74 C126 70 134 78 146 74" stroke="#7FA5C0" stroke-width="1.8" fill="none"/>

    <!-- steam -->
    <path d="M100 46 C96 40 104 37 100 31" stroke="#7FA5C0" stroke-width="1.8"/>
    <path d="M126 46 C122 40 130 37 126 31" stroke="#7FA5C0" stroke-width="1.8"/>

    <!-- stool and bucket -->
    <rect x="16" y="86" width="30" height="6" fill="#E3D8C6"/>
    <line x1="21" y1="92" x2="21" y2="104"/>
    <line x1="41" y1="92" x2="41" y2="104"/>
    <path d="M52 92 L54 104 L68 104 L70 92 Z" fill="#D8A7A0"/>

    <!-- shower head -->
    <line x1="30" y1="60" x2="30" y2="40"/>
    <circle cx="30" cy="36" r="5" fill="#CFD6D9"/>
    <line x1="8" y1="104" x2="152" y2="104"/>
  </g>
</svg>
