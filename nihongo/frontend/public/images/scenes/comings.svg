<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A Japanese entryway with shoes">
  <!-- Coming and going. The genkan: the step down, the door, shoes turned to
       face out. This is where ittekimasu and itterasshai are said. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- the front door, ajar -->
    <rect x="86" y="12" width="56" height="76" fill="#DCE6EC"/>
    <line x1="86" y1="12" x2="86" y2="88"/>
    <rect x="98" y="26" width="32" height="20" fill="#A9C6DC"/>
    <circle cx="94" cy="56" r="3" fill="#2F4858"/>

    <!-- raised floor and the step down into the genkan -->
    <line x1="8" y1="72" x2="86" y2="72" stroke="#8FA394"/>
    <rect x="8" y="72" width="78" height="16" fill="#F2EBDD" stroke="none"/>
    <line x1="8" y1="88" x2="152" y2="88"/>
    <rect x="8" y="88" width="144" height="26" fill="#CFD6D9" stroke="none" opacity="0.5"/>

    <!-- two pairs of shoes, facing the door -->
    <path d="M26 104 L26 98 L40 98 L44 104 Z" fill="#E3D8C6"/>
    <path d="M50 104 L50 98 L64 98 L68 104 Z" fill="#E3D8C6"/>
    <path d="M96 104 L96 99 L106 99 L109 104 Z" fill="#D8A7A0"/>

    <!-- umbrella stand -->
    <rect x="146" y="76" width="10" height="12" fill="#B7C5AE"/>
    <line x1="151" y1="76" x2="151" y2="58"/>
    <path d="M144 60 C147 54 155 54 158 60" stroke="#7FA5C0"/>
  </g>
</svg>
