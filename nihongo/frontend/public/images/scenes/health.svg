<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A clinic consulting room">
  <!-- Doctor and dentist. A consulting room: a reclining chair, a lamp on an
       arm, a small trolley. One figure, small and off to the side. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- wall and a window -->
    <rect x="0" y="0" width="160" height="84" fill="#DCE6EC" stroke="none"/>
    <rect x="14" y="14" width="34" height="28" fill="#C7DAE8"/>
    <line x1="31" y1="14" x2="31" y2="42"/>
    <rect x="14" y="14" width="34" height="28"/>

    <!-- reclining chair -->
    <path d="M64 92 L64 74 C64 68 70 66 76 66 L112 66 C118 66 122 70 122 76 L122 92 Z" fill="#A9C6DC"/>
    <path d="M112 66 L126 50 C129 46 134 48 134 52 L134 62" fill="#C7DAE8"/>
    <line x1="70" y1="92" x2="70" y2="104"/>
    <line x1="116" y1="92" x2="116" y2="104"/>

    <!-- lamp on an arm -->
    <line x1="140" y1="104" x2="140" y2="46"/>
    <line x1="140" y1="46" x2="118" y2="34"/>
    <path d="M110 28 L126 28 L122 40 L114 40 Z" fill="#F2EBDD"/>

    <!-- small trolley with an accent tray -->
    <rect x="20" y="70" width="28" height="5" fill="#E3D8C6"/>
    <rect x="26" y="64" width="12" height="6" fill="#D8A7A0"/>
    <line x1="25" y1="75" x2="25" y2="96"/>
    <line x1="43" y1="75" x2="43" y2="96"/>
    <line x1="6" y1="104" x2="154" y2="104"/>
  </g>
</svg>
