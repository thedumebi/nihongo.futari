<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A small shop front with an awning">
  <!-- Shopping. A shopfront: striped awning, a window of goods, a basket of
       produce outside. The awning carries the one blush accent. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- building face -->
    <rect x="12" y="20" width="136" height="82" fill="#F2EBDD"/>

    <!-- awning -->
    <path d="M8 44 L20 20 L140 20 L152 44 Z" fill="#C7DAE8"/>
    <g stroke="#D8A7A0" stroke-width="3">
      <line x1="42" y1="21" x2="34" y2="43"/>
      <line x1="80" y1="21" x2="80" y2="43"/>
      <line x1="118" y1="21" x2="126" y2="43"/>
    </g>
    <path d="M8 44 L20 20 L140 20 L152 44 Z"/>

    <!-- window of goods -->
    <rect x="24" y="54" width="60" height="34" fill="#DCE6EC"/>
    <g stroke="#8FA394" stroke-width="1.8">
      <line x1="24" y1="72" x2="84" y2="72"/>
      <circle cx="38" cy="64" r="5"/>
      <circle cx="54" cy="64" r="5"/>
      <rect x="30" y="76" width="14" height="9"/>
      <rect x="52" y="76" width="14" height="9"/>
    </g>
    <rect x="24" y="54" width="60" height="34"/>

    <!-- doorway -->
    <rect x="102" y="56" width="30" height="46" fill="#A9C6DC"/>
    <circle cx="107" cy="80" r="2.5" fill="#2F4858"/>

    <!-- basket outside -->
    <path d="M24 102 L28 92 L56 92 L60 102 Z" fill="#E3D8C6"/>
    <line x1="6" y1="102" x2="154" y2="102"/>
  </g>
</svg>
