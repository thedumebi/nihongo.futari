<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A convenience store interior">
  <!-- At a konbini. The register counter, a chilled drinks cabinet, a shelf of
       onigiri, one customer with a basket. Signage is shape-only: no lettering. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- fascia band, blank -->
    <rect x="8" y="10" width="144" height="12" fill="#A9C6DC"/>

    <!-- chilled drinks cabinet, left -->
    <rect x="14" y="28" width="42" height="62" fill="#DCE6EC"/>
    <line x1="35" y1="28" x2="35" y2="90"/>
    <g fill="#7FA5C0" stroke="#2F4858" stroke-width="1.4">
      <rect x="19" y="34" width="5" height="10"/><rect x="26" y="34" width="5" height="10"/>
      <rect x="40" y="34" width="5" height="10"/><rect x="47" y="34" width="5" height="10"/>
      <rect x="19" y="50" width="5" height="10"/><rect x="26" y="50" width="5" height="10"/>
      <rect x="40" y="50" width="5" height="10"/><rect x="47" y="50" width="5" height="10"/>
    </g>
    <g fill="#B7C5AE" stroke="#2F4858" stroke-width="1.4">
      <rect x="19" y="66" width="5" height="10"/><rect x="26" y="66" width="5" height="10"/>
      <rect x="40" y="66" width="5" height="10"/><rect x="47" y="66" width="5" height="10"/>
    </g>

    <!-- onigiri shelf, centre -->
    <rect x="64" y="46" width="34" height="30" fill="#F2EBDD"/>
    <line x1="64" y1="61" x2="98" y2="61" stroke-width="1.8"/>
    <g fill="#FBFAF7" stroke="#2F4858" stroke-width="1.5">
      <path d="M69 58 L73 50 L77 58 Z"/><path d="M80 58 L84 50 L88 58 Z"/>
      <path d="M69 73 L73 65 L77 73 Z"/><path d="M80 73 L84 65 L88 73 Z"/>
    </g>
    <g fill="#8FA394" stroke="none">
      <rect x="69" y="55.5" width="8" height="2.5"/><rect x="80" y="55.5" width="8" height="2.5"/>
      <rect x="69" y="70.5" width="8" height="2.5"/><rect x="80" y="70.5" width="8" height="2.5"/>
    </g>

    <!-- register counter, right -->
    <rect x="106" y="66" width="44" height="24" fill="#E3D8C6"/>
    <rect x="116" y="52" width="20" height="14" rx="2" fill="#DCE6EC"/>
    <rect x="120" y="56" width="12" height="6" fill="#7FA5C0" stroke="none"/>
    <line x1="8" y1="90" x2="152" y2="90" stroke="#CFD6D9"/>

    <!-- customer with a basket; the basket is the accent -->
    <circle cx="84" cy="88" r="6.5" fill="#E3D8C6"/>
    <path d="M76 100 Q76 92 84 92 Q92 92 92 100 Z" fill="#A9C6DC"/>
    <rect x="93" y="93" width="11" height="8" rx="1.5" fill="#D8A7A0"/>
    <path d="M95 93 Q98.5 89 102 93" stroke-width="1.6"/>
  </g>
</svg>
