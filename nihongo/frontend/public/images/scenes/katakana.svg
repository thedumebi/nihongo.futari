<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="A pen on a grid notebook">
  <!-- Katakana. Deliberately the modern counterpart to the hiragana brush: a
       ballpoint on grid paper, angular marks rather than curves. Still no
       real characters — the shapes are abstract. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- grid notebook -->
    <rect x="20" y="18" width="92" height="84" fill="#DCE6EC"/>
    <g stroke="#B3BEC4" stroke-width="1.1">
      <line x1="20" y1="39" x2="112" y2="39"/>
      <line x1="20" y1="60" x2="112" y2="60"/>
      <line x1="20" y1="81" x2="112" y2="81"/>
      <line x1="43" y1="18" x2="43" y2="102"/>
      <line x1="66" y1="18" x2="66" y2="102"/>
      <line x1="89" y1="18" x2="89" y2="102"/>
    </g>
    <rect x="20" y="18" width="92" height="84"/>

    <!-- spiral binding -->
    <g stroke="#8FA394" stroke-width="2">
      <line x1="16" y1="28" x2="24" y2="24"/>
      <line x1="16" y1="48" x2="24" y2="44"/>
      <line x1="16" y1="68" x2="24" y2="64"/>
      <line x1="16" y1="88" x2="24" y2="84"/>
    </g>

    <!-- two angular practice marks -->
    <path d="M28 32 L40 32 M34 32 L30 44" stroke="#7FA5C0" stroke-width="2"/>
    <path d="M72 52 L84 56 M72 62 L84 66" stroke="#7FA5C0" stroke-width="2"/>

    <!-- pen -->
    <line x1="118" y1="104" x2="146" y2="40"/>
    <path d="M146 40 L150 30 L154 34 L150 44 Z" fill="#D8A7A0"/>
    <line x1="130" y1="76" x2="138" y2="80"/>
  </g>
</svg>
