<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-label="An office desk with a laptop">
  <!-- At work. A desk island: laptop, a mug, a document tray, one small figure
       at the far desk so nobody dominates the frame. -->
  <g fill="none" stroke="#2F4858" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="160" height="120" fill="#FBFAF7" stroke="none"/>

    <!-- partition wall behind -->
    <rect x="0" y="18" width="160" height="44" fill="#DCE6EC" stroke="none"/>
    <line x1="0" y1="62" x2="160" y2="62" stroke="#B3BEC4" stroke-width="1.4"/>

    <!-- a colleague at the back, small and off-centre -->
    <circle cx="130" cy="46" r="7" fill="#E3D8C6"/>
    <path d="M120 62 C120 53 140 53 140 62 Z" fill="#B7C5AE"/>

    <!-- desk -->
    <line x1="6" y1="86" x2="154" y2="86"/>
    <rect x="6" y="86" width="148" height="8" fill="#E3D8C6" stroke="none"/>
    <line x1="22" y1="94" x2="22" y2="110"/>
    <line x1="138" y1="94" x2="138" y2="110"/>

    <!-- laptop -->
    <path d="M40 86 L46 60 L88 60 L94 86 Z" fill="#C7DAE8"/>
    <rect x="46" y="60" width="42" height="26" fill="#DCE6EC"/>
    <line x1="40" y1="86" x2="94" y2="86"/>

    <!-- mug, the accent -->
    <rect x="106" y="74" width="14" height="12" rx="2" fill="#D8A7A0"/>
    <path d="M120 77 C126 77 126 83 120 83" stroke="#2F4858"/>

    <!-- document tray -->
    <rect x="20" y="76" width="14" height="10" fill="#F2EBDD"/>
  </g>
</svg>
