<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2f4858" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn a language, and learn why it works the way it does. Vocabulary, characters and grammar with sourced explanations."
    />
    <title>語 go</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      // useLocalStorage stores the string value raw (no JSON quotes). Key and
      // default must match the Pinia store (store/ui.ts): 'nihongo-theme-v3', light.
      var t = localStorage.getItem('nihongo-theme-v3')
      document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
