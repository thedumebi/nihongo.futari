server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness probe endpoint
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # better-auth lives at /api/auth on the backend (its default basePath), so
  # this block keeps the /api prefix intact. No trailing slash on proxy_pass.
  location /api/auth/ {
    proxy_pass http://nihongo-backend:3008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else under /api strips the prefix and maps to backend root
  # routes (/api/study/queue -> /study/queue). Trailing slash strips.
  location /api/ {
    proxy_pass http://nihongo-backend:3008/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets are immutable and safe to cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Audio and stroke data live on R2 and are cached by the service worker, not
  # here — but the media proxy path is reserved so the origin can change without
  # touching the client.
  location /media/ {
    proxy_pass http://nihongo-backend:3008/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- PWA -------------------------------------------------------------------
  # The service worker and manifest MUST NOT be cached. A cached sw.js never
  # updates, which strands every client on an old build with an old offline
  # bundle format — the single most common way to brick a PWA.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    expires off;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  # index.html is the version pointer for the hashed assets above; caching it
  # defeats the whole scheme.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # SPA history-mode fallback — every unknown path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;
}
