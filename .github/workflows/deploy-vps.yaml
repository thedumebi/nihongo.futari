name: Deploy to VPS (Docker Compose)

# Auto-deploys the Docker Compose stack to the single VPS on every push to
# master. Flow: run the checks, then SSH into the server, fast-forward the repo
# to the pushed commit, rebuild the images, run DB migrations, and prune.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     server IP or hostname (e.g. nihongo.futari.live)
#   DEPLOY_USER     ssh user on the server (e.g. deploy)
#   DEPLOY_SSH_KEY  PRIVATE key whose public half is in the server user's
#                   ~/.ssh/authorized_keys (generate a dedicated CI keypair)
#   DEPLOY_PATH     absolute path to the repo on the server
#                   (e.g. /home/deploy/nihongo)
#   DEPLOY_PORT     ssh port (optional, defaults to 22)
#
# Server prerequisites (one-time, from DEPLOY.md Steps 3-5):
#   - repo cloned and reachable from GitHub (private repo => read-only deploy key)
#   - dotenvx installed (curl -sfS https://dotenvx.sh | sh)
#   - nihongo/backend/.env.keys present (the decryption key; never in git)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --ignore-scripts
      - name: Build shared package
        run: pnpm --filter @nihongo/shared build
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # Fast-forward the working tree to exactly the pushed commit
            # (this also pulls the latest encrypted nihongo/backend/.env.production).
            git fetch origin master
            git reset --hard origin/master

            # dotenvx decrypts .env.production (using the server-only
            # nihongo/backend/.env.keys) into the env for Compose substitution.
            DC="dotenvx run -f nihongo/backend/.env.production -- docker compose -f docker-compose.prod.yml"

            # Rebuild images and recreate changed containers (old ones keep
            # serving until the new ones are ready).
            $DC up -d --build

            # Apply any pending DB migrations.
            $DC run --rm -e DB_MIGRATING=true backend node dist/db/migrate.js

            # Reclaim space from dangling build layers.
            docker image prune -f
